<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Food Outlets Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }
    #map {
      height: 100%;
      width: 100%;
    }
    .custom-popup .leaflet-popup-content-wrapper {
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(0, 0, 0, 0.05);
    }
    .popup-title {
      font-weight: 600;
      font-size: 14px;
      color: #111827;
      margin-bottom: 2px;
    }
    .popup-desc {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 8px;
    }
    .popup-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 9999px;
      margin-bottom: 8px;
    }
    .status-open {
      background-color: #ecfdf5;
      color: #059669;
    }
    .status-closed {
      background-color: #fef2f2;
      color: #dc2626;
    }
    .status-maintenance {
      background-color: #fffbeb;
      color: #d97706;
    }
    .popup-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: #4f46e5;
      color: white !important;
      text-decoration: none;
      font-size: 11px;
      font-weight: 500;
      padding: 6px 0;
      border-radius: 6px;
      margin-top: 6px;
      transition: background 0.15s ease;
    }
    .popup-btn:hover {
      background: #4338ca;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    // Initialize Map at a default campus coordinate
    const map = L.map('map', {
      zoomControl: true,
      attributionControl: false
    }).setView([30.7688, 76.5754], 16);

    // Google Maps Layer
    L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
    }).addTo(map);

    const markersGroup = L.featureGroup().addTo(map);

    // Color code based on status
    function getStatusClass(status) {
      if (status === 'OPEN') return 'status-open';
      if (status === 'CLOSED' || status === 'TEMPORARILY_CLOSED') return 'status-closed';
      return 'status-maintenance';
    }

    // Function to draw markers
    function loadVenues(venues) {
      markersGroup.clearLayers();
      
      if (!venues || venues.length === 0) return;

      venues.forEach(venue => {
        if (!venue.latitude || !venue.longitude) return;

        const statusClass = getStatusClass(venue.status);
        const popupContent = `
          <div class="custom-popup">
            <div class="popup-title">${venue.name}</div>
            <div class="popup-badge ${statusClass}">${venue.status}</div>
            <div class="popup-desc">${venue.building || 'Campus building'}</div>
            <button onclick="parent.postMessage({type: 'VIEW_MENU', venueId: '${venue.id}'}, '*')" class="popup-btn" style="border:none; cursor:pointer;">
              View Menu & Details
            </button>
          </div>
        `;

        // Create standard marker
        const marker = L.marker([venue.latitude, venue.longitude])
          .bindPopup(popupContent);
        
        markersGroup.addLayer(marker);
      });

      // Fit map bounds to contain all markers
      if (venues.length > 0) {
        map.fitBounds(markersGroup.getBounds(), { padding: [40, 40] });
      }
    }

    // Listen for messages from parent component
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'LOAD_VENUES') {
        loadVenues(event.data.venues);
      }
    });

    // Notify parent that map is ready
    window.parent.postMessage({ type: 'MAP_READY' }, '*');
  </script>
</body>
</html>
